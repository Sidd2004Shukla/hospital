name: Python Quality Gates & Docker Publish

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  quality-gates-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-build-isolation
          pip install ruff==0.16.2 httpx

      # GATE 1: Lint
      - name: Gate 1 - Ruff lint
        run: |
          ruff check .

      # GATE 2: Tests + 85% coverage (targeting src.hospital)
      - name: Gate 2 - Pytest coverage
        run: |
          pytest --cov=src.hospital --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      # GATE 3: Security
      - name: Gate 3 - Bandit security scan
        run: |
          bandit -r src/

      # DOCKER HUB PUBLISHING (Only runs on push to main/master)
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hospital-api:latest